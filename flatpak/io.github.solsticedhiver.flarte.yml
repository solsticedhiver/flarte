# yaml-language-server: $schema=https://raw.githubusercontent.com/flatpak/flatpak-builder/main/data/flatpak-manifest.schema.json

---
app-id: io.github.solsticedhiver.flarte
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: flarte
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  #- --filesystem=/usr/bin/cvlc:ro
  - --filesystem=xdg-download
modules:
  - name: ffmpeg
    cleanup:
      - '/share/name'
      - '/share/ffmpeg/examples'
    config-opts:
      - --enable-shared
      - --disable-static
      - --enable-gnutls
      - --disable-doc
      - --enable-encoder=png
      - --disable-libv4l2
      - --enable-libdav1d
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.gz
        sha256: 32faba5ef67340d54724941eae1425580791195312a4fd13bf6f820a2818bf22
  - name: libass
    cleanup:
      - '/include'
      - '/lib/*.la'
      - '/lib/pkgconfig'
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/archive/refs/tags/0.17.5.tar.gz
        sha256: caab4b993dd7be6187c55623b789ed75dddefea6e65938af134637c732fe094a

  # Dependency for libplacebo; generated with uvx --from flatpak-pip-generator flatpak_pip_generator --runtime=org.freedesktop.Sdk//25.08 --yaml jinja2
  - name: python3-jinja2
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "jinja2" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/62/a1/3d680cbfd5f4b8f15abc1d571870c5fc3e594bb582bc3b64ea099db13e56/jinja2-3.1.6-py3-none-any.whl
        sha256: 85ece4451f492d0c13c5dd7c13a64681a86afae63a5f347908daf103ce6d2f67
      - type: file
        url: https://files.pythonhosted.org/packages/7e/99/7690b6d4034fffd95959cbe0c02de8deb3098cc577c67bb6a24fe5d7caa7/markupsafe-3.0.3.tar.gz
        sha256: 722695808f4b6457b320fdc131280796bdceb04ab50fe1795cd540799ebe1698
  - name: libplacebo
    cleanup:
      - '/include'
      - '/lib/pkgconfig'
    buildsystem: meson
    config-opts:
      - -Dvulkan=disabled
      - -Dshaderc=disabled
      - -Dvulkan=disabled
      - -Dvk-proc-addr=disabled
      - -Dvulkan-registry=disabled
      - -Dopengl=disabled
      - -Dgl-proc-addr=disabled
      - -Dd3d11=disabled
      - -Dglslang=disabled
      - -Dshaderc=disabled
      - -Dlcms=disabled
      - -Ddovi=disabled
      - -Dlibdovi=disabled
      - -Dunwind=disabled
      - -Dxxhash=disabled
      - -Ddemos=false
    sources:
      - type: archive
        url: https://github.com/haasn/libplacebo/archive/refs/tags/v7.360.1.tar.gz
        sha256: d05fdf90bea2f629eaa2d115e909fd356388ac639e54f77b87a018a6d76224bd

  - name: libmpv
    cleanup:
      - '/include'
      - '/lib/pkgconfig'
      - '/share/name'
      - 'lib/*.a'
    buildsystem: meson
    config-opts:
      - -Dbuild-date=false
      - -Dlibmpv=true
      - -Dcplayer=false
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209
    
  - name: Flarte
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - cp flarte /app/
      - cp -a lib /app/
      - cp -a data /app/
      - mkdir -p /app/bin
      - ln -s /app/flarte /app/bin/flarte
      - mkdir -p /app/share/{metainfo,applications,icons/hicolor/256x256/apps}
      - cp io.github.solsticedhiver.flarte.png /app/share/icons/hicolor/256x256/apps
      - cp io.github.solsticedhiver.flarte.desktop /app/share/applications/
      - cp io.github.solsticedhiver.flarte.metainfo.xml /app/share/metainfo/
    sources:
      - type: git
        url: https://github.com/solsticedhiver/flarte.git
        commit: 46f38684f1358d385a45759bb8f09917e5c07666
      - type: file
        path: io.github.solsticedhiver.flarte.png
      - type: file
        path: io.github.solsticedhiver.flarte.metainfo.xml
      - type: file
        path: io.github.solsticedhiver.flarte.desktop
    cleanup:
      - '/lib/*.a'
      - '/lib/debug'
      - '/lib/python*'
      - '/lib/pkgconfig'

